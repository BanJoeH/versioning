name: 'MyDianomi Versioning'
description: 'update release notes, version and commit'
runs:
  using: 'node20'
  main: './index.js'
inputs:
  github-token:
    description: 'Github token used to push version changes and look up pull request labels'
    default: ${{ github.token }}
    required: false
  git-user-name:
    description: 'Git user name'
    default: 'MyDianomi'
    required: true
  git-user-email:
    description: 'Git user email'
    default: 'mydianomi@dianomi.com'
    required: true
  dry-run:
    description: 'Dry run'
    default: 'false'
    required: false
  comment-on-failure:
    description: 'Post or update a pull request comment when versioning validation fails'
    default: 'true'
    required: false
  git-branch:
    description: 'Git branch'
    default: ${{ github.ref }}
    required: false
  git-url:
    description: 'Git Url'
    default: 'github.com'
    required: false
outputs:
  version: 
    description: 'New version to be applied to package.json and release.md'
  release-message:
    description: 'Commit message'
  committed:
    description: 'True if commit was made'
